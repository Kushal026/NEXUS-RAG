name: NEXUS-RAG CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Security & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System OCR & PDF Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint Code with Flake8
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute Full Pytest Test Suite
        run: |
          python -m pytest backend/tests/ -v --cov=backend/app --cov-report=term-missing

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build
