version: '3.8'

services:
  # NEXUS-RAG Core Backend API Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexus_graph_password_2026
      - SECRET_KEY=nexus_rag_enterprise_secret_key_2026_super_secure
    depends_on:
      - redis
      - neo4j
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus-network

  # NEXUS-RAG Next.js Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-rag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - nexus-network

  # Redis Distributed Caching Layer
  redis:
    image: redis:7-alpine
    container_name: nexus-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - nexus-network

  # Neo4j Enterprise Knowledge Graph Store
  neo4j:
    image: neo4j:5.18.0-community
    container_name: nexus-neo4j-graph
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/nexus_graph_password_2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  redis-data:
  neo4j-data:
