version: '3.8'

services:
  # PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-rag-postgres
    restart: always
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for cache & rate limiting
  redis:
    image: redis:7-alpine
    container_name: nexus-rag-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Neo4j 5 Graph Database (Phase 5)
  neo4j:
    image: neo4j:5.18-community
    container_name: nexus-rag-neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/nexus_graph_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Engine
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: nexus-rag-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      - PROJECT_NAME=NEXUS-RAG
      - ENVIRONMENT=production
      - LLM_PROVIDER=local_heuristic
      - EMBEDDING_PROVIDER=sentence_transformers
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=nexus_user
      - POSTGRES_PASSWORD=nexus_password
      - POSTGRES_DB=nexus_rag_db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexus_graph_password
      - NEO4J_DATABASE=neo4j
      - GRAPH_STORAGE_MODE=auto
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/data

  # Next.js Frontend Evidence Workbench
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: nexus-rag-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  backend_storage:
